plugins {
    id 'java'
    id 'idea'
}

dependencies {
    implementation group: 'com.fazecast', name:'jSerialComm', version: '2.11.4'

    testImplementation(platform(group: 'org.junit', name: 'junit-bom', version :'6.0.3'))
    testImplementation group: 'org.junit.jupiter', name:'junit-jupiter'
    testRuntimeOnly group: 'org.junit.platform', name: 'junit-platform-launcher'
}

test {
    useJUnitPlatform()
}